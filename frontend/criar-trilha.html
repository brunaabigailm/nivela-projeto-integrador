<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIVELA — Criar Trilha de Aprendizagem</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-marca">
      <a class="botao-voltar" href="dashboard-gestor.html" aria-label="Voltar">←</a>
      <div class="topbar-textos">
        <strong>Criar Trilha de Aprendizagem</strong>
        <span>Configure um novo programa de onboarding</span>
      </div>
    </div>
    <div class="topbar-usuario">
      <div class="topbar-textos topbar-textos-direita">
        <strong id="usuario-nome">—</strong>
        <span id="usuario-email">—</span>
      </div>
      <div class="topbar-avatar" id="usuario-avatar">?</div>
      <button class="btn btn-secondary" id="btn-sair">Sair</button>
    </div>
  </header>

  <main class="container">
    <form id="form-trilha">
      <section class="card form-secao">
        <h2 class="form-secao-titulo">
          <span class="form-secao-icone">📖</span>
          Informações da Trilha
        </h2>

        <div class="form-field">
          <label class="form-label" for="titulo">Nome da Trilha *</label>
          <input class="input" type="text" id="titulo" name="titulo"
                 placeholder="Ex: Onboarding Desenvolvedores" required>
        </div>

        <div class="form-field">
          <label class="form-label" for="descricao">Descrição</label>
          <textarea class="input" id="descricao" name="descricao" rows="4"
                    placeholder="Descreva o objetivo desta trilha de aprendizagem..."></textarea>
        </div>

        <div class="form-field">
          <label class="form-label" for="cargo">Cargo de Destino</label>
          <select class="input" id="cargo" name="cargo">
            <option value="">— Sem cargo específico —</option>
          </select>
        </div>
      </section>

      <section class="card form-secao">
        <div class="form-secao-cabecalho">
          <h2 class="form-secao-titulo">
            <span class="form-secao-icone">📖</span>
            Módulos de Aprendizagem
          </h2>
          <button type="button" class="btn btn-secondary" id="btn-adicionar-modulo">
            + Adicionar Módulo
          </button>
        </div>

        <div id="lista-modulos"></div>

        <p class="dica-modulos">
          <strong>Dica:</strong> certifique-se de criar uma sequência lógica de aprendizado.
        </p>
      </section>

      <section class="card form-secao">
        <div class="form-secao-cabecalho">
          <h2 class="form-secao-titulo">
            <span class="form-secao-icone">📝</span>
            Avaliação Final (opcional)
          </h2>
          <button type="button" class="btn btn-secondary" id="btn-toggle-avaliacao">
            + Adicionar Avaliação
          </button>
        </div>

        <div id="avaliacao-conteudo" hidden>
          <div class="form-grid">
            <div class="form-field">
              <label class="form-label" for="aval-titulo">Título da Avaliação</label>
              <input class="input" type="text" id="aval-titulo" placeholder="Ex: Avaliação de Onboarding">
            </div>
            <div class="form-field">
              <label class="form-label" for="aval-nota-minima">Nota Mínima</label>
              <input class="input" type="number" id="aval-nota-minima" step="0.1" min="0" max="10" value="7.0">
            </div>
          </div>

          <div class="form-secao-cabecalho" style="margin-top: var(--espaco-md);">
            <h3 class="bloco-titulo" style="margin: 0;">Questões</h3>
            <button type="button" class="btn btn-secondary" id="btn-adicionar-questao">
              + Adicionar Questão
            </button>
          </div>
          <div id="lista-questoes"></div>
        </div>
      </section>

      <p id="trilha-erro" class="mensagem-erro" hidden></p>
      <p id="trilha-sucesso" class="mensagem-sucesso" hidden></p>

      <div class="form-acoes">
        <a class="btn btn-secondary" href="dashboard-gestor.html">Cancelar</a>
        <button class="btn btn-primary" type="submit">Criar Trilha</button>
      </div>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/criar-trilha.js"></script>
</body>
</html>
